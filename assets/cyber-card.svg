<svg fill="none" viewBox="0 0 800 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: linear-gradient(135deg, #090d16 0%, #111827 50%, #06090e 100%);
          border: 1px solid rgba(56, 189, 248, 0.35);
          border-radius: 16px;
          padding: 24px 30px;
          font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
          color: #e6edf3;
          position: relative;
          overflow: hidden;
          box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
          transition: all 0.4s ease;
        }
        .container:hover {
          border-color: #38bdf8;
          box-shadow: 0 0 30px rgba(56, 189, 248, 0.4), 0 12px 40px rgba(0, 0, 0, 0.7);
          transform: translateY(-2px);
        }
        .grid-bg {
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background-size: 24px 24px;
          background-image: 
            linear-gradient(to right, rgba(56, 189, 248, 0.06) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
          pointer-events: none;
        }
        .radar-line {
          position: absolute;
          top: 0; left: -100%; width: 50%; height: 100%;
          background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.18), transparent);
          animation: scan 4s infinite linear;
          pointer-events: none;
        }
        @keyframes scan {
          0% { left: -50%; }
          100% { left: 150%; }
        }
        .badges-row {
          display: flex;
          gap: 8px;
          margin-bottom: 12px;
          position: relative;
          z-index: 2;
        }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          background: rgba(56, 189, 248, 0.12);
          border: 1px solid rgba(56, 189, 248, 0.4);
          color: #38bdf8;
          padding: 4px 12px;
          border-radius: 20px;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.6px;
          text-transform: uppercase;
          transition: all 0.3s ease;
        }
        .container:hover .badge {
          background: rgba(56, 189, 248, 0.25);
          box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
        }
        .dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #34d399;
          box-shadow: 0 0 8px #34d399;
          animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.85); }
        }
        .title {
          font-size: 26px;
          font-weight: 800;
          margin: 0 0 4px 0;
          background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: shine 5s linear infinite;
          position: relative;
          z-index: 2;
        }
        @keyframes shine {
          to { background-position: 200% center; }
        }
        .subtitle {
          font-size: 13.5px;
          color: #94a3b8;
          margin-bottom: 16px;
          position: relative;
          z-index: 2;
        }
        .stat-grid {
          display: flex;
          gap: 12px;
          position: relative;
          z-index: 2;
        }
        .stat-card {
          flex: 1;
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 10px;
          padding: 10px 12px;
          transition: all 0.3s ease;
        }
        .stat-card:hover {
          background: rgba(56, 189, 248, 0.1);
          border-color: rgba(56, 189, 248, 0.5);
          box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
          transform: translateY(-2px);
        }
        .stat-val {
          font-size: 14.5px;
          font-weight: 700;
          color: #38bdf8;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .stat-lbl {
          font-size: 10.5px;
          color: #64748b;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          margin-top: 2px;
        }
      </style>
      <div class="container">
        <div class="grid-bg"></div>
        <div class="radar-line"></div>
        <div class="badges-row">
          <span class="badge"><span class="dot"></span>ACTIVE DEV</span>
          <span class="badge" style="color: #34d399; border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.1);">PARROT OS CONTRIBUTOR</span>
          <span class="badge" style="color: #f472b6; border-color: rgba(244, 114, 182, 0.4); background: rgba(244, 114, 182, 0.1);">DURGA OS ARCHITECT</span>
        </div>
        <div class="title">⚡ Durga Prasad</div>
        <div class="subtitle">Operating System Architect &bull; Cybersecurity Specialist &bull; Open Source Contributor</div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-val">Durga OS 1.0</div>
            <div class="stat-lbl">Hybrid OS Base</div>
          </div>
          <div class="stat-card">
            <div class="stat-val">Sailesh Spy</div>
            <div class="stat-lbl">Network Sniffer</div>
          </div>
          <div class="stat-card">
            <div class="stat-val">ParrotSec PRs</div>
            <div class="stat-lbl">OS Contributions</div>
          </div>
          <div class="stat-card">
            <div class="stat-val">Typing Journey</div>
            <div class="stat-lbl">Next.js Web App</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>